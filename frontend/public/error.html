<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI-MIMS - Connection Required</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon-container {
      width: 64px;
      height: 64px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
    }
    .icon-container svg {
      width: 32px;
      height: 32px;
      stroke: #f87171;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 12px;
      font-weight: 600;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 20px;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
    }
    .btn:active {
      background-color: #1d4ed8;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-family: monospace;
      background-color: #1e293b;
      color: #cbd5e1;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>
    <div class="subtitle">Government of the Punjab • DGM&M</div>
    <h1>No Internet Connection</h1>
    <p>
      AI-MIMS requires an active internet connection to communicate with the Punjab Mining Inspection cloud server.
      Please check your mobile data or Wi-Fi connection.
    </p>
    <button class="btn" onclick="retryConnection()">Retry Connection</button>
    <div>
      <span class="badge">pk.edu.uet.ai.mims</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      window.location.href = 'https://ai-director-xn44.onrender.com/';
    }

    // Auto-retry when internet comes back online
    window.addEventListener('online', function() {
      retryConnection();
    });

    // Periodically probe connection every 8 seconds
    setInterval(function() {
      if (navigator.onLine) {
        retryConnection();
      }
    }, 8000);
  </script>
</body>
</html>
